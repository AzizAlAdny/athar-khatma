name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # Report-only checks — they shouldn't block the build
      - name: Run ESLint
        continue-on-error: true
        run: npm run lint

      - name: Prettier check
        continue-on-error: true
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}"

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build Next.js
        run: npm run build
